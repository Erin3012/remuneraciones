---
deployment:
  tasks:
    - export DEPLOYPATH=/home/qlccl/remuneraciones/
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R vendor $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -R tests $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/tools
    - /bin/cp tools/migrate_global_periods.php $DEPLOYPATH/tools/
    - /bin/cp tools/migrate_monthly_allowances.php $DEPLOYPATH/tools/
    - /bin/cp tools/migrate_family_allowance.php $DEPLOYPATH/tools/
    - /bin/cp database/migration_patriotic_bonus.sql $DEPLOYPATH/database/
    - /bin/cp README.md $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH
    - /bin/cp .env.example $DEPLOYPATH
